<sly data-sly-use.model="com.epam.empathylab.core.models.contentblockcontainer.ContentBlockContainerModel"/>
<div data-sly-test="${wcmmode.edit || properties.style!='scrollable'}"
     class="${properties.style=='leftMargin'? 'grid grid-cols-6 md:grid-cols-12 gap-2 md:gap-4 mx-4 sm:mx-10 md:mx-20':''}"
     x-data="contentBlockContainerData">
    <div class="col-span-6 md:col-span-9" data-sly-resource="${'container' @ resourceType='empathylab/components/structure/container', decorationTagName='div'}"></div>
</div>

<div
    data-sly-test="${!wcmmode.edit && properties.style=='scrollable'}"
    x-data="contentBlockContainerScrollerData"
    class="vertical-slider w-full h-full my-[120px] flex flex-col align-center relative overflow-hidden">
    <div class="vertical-slider-slide min-h-[500px] max-h-[100vh] [&_p]:text-clip [&(:first-child)]:relative [&:not(:first-child)]:absolute top-0 left-0 bg-secondary" data-sly-repeat="${model.allowedComponents}">
        <sly data-sly-resource="${item}"/>
    </div>
</div>
